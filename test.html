<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sample HTML Page</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f5f5f5;
        }

        header {
            background-color: #333;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 30px;
            background-color: white;
            border-radius: 8px;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <header>
        <h1>My Sample HTML Page</h1>
    </header>

    <main>
        <h2>Welcome!</h2>

        <p>
            This is a sample HTML page containing common HTML elements.
        </p>

        <h3>Features</h3>

        <ul>
            <li>HTML structure</li>
            <li>CSS styling</li>
            <li>JavaScript interaction</li>
        </ul>

        <button onclick="showMessage()">
            Click Me
        </button>

        <p id="message"></p>
    </main>

    <script>
        function showMessage() {
            document.getElementById("message").textContent =
                "Hello! You clicked the button.";
        }
    </script>

</body>
</html>
